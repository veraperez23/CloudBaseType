wandb:
    use: True
    project: "CloudType"
    #entity : "topclasetrabajos"


train:
    train_dir: './imagenes_todoeldia/imagenes train'
    batch_size: 8
    num_workers: 0
    loss: 'CrossEntropyLoss' # MSE | CrossEntropyLoss | CustomLoss
    epochs: 100
    log_freq: 2
    out_path: "results/"
    patience: 20
    refine_flag: False
    refine_dir: ''
    percentage_refine: 0.08
    physics_degradations: False


augmentations:
    geom:
        prob_flip: 0.5
        prob_rotate: 1.0
    low_light:
        prob_apply: 0.5
        blur_sigma: [0.5, 1.5]
        exposure_factor: [0.4, 0.9]
        noise_gaussian_sigma: [0.05, 0.15]
        noise_poisson_scale: [0.1, 0.3]
        hot_pixels_prob: 0.2
        hot_pixels_ratio: 0.001
    high_light:
        exposure_factor: [1.0, 1.3]
        saturation_factor: [1.0, 1.6]
        contrast_factor: [1.0, 1.4]
        jpeg_quality: [85, 95]
        bloom_radius: [0.5, 2.0]


transformers:
    warmup: True # the maximum value of lr is taken from optim.lr --> For refine turn false
    lr_min: 0.000001
    warmup_t: 10          
    warmup_lr_init: 0.00001
    cycle_limit: 1 
    freeze: True 
    freeze_steps: 5

optim:
    amsgrad: True
    weight_decay: 0.001
    lr: 0.0001
    T_max: 90
    eta_min: 0.000001
    accum_steps: 8


validation:
    val_dir: './imagenes_todoeldia/imagenes_val'
    batch_size: 8
    num_workers: 0 #teníamos puesto antes 16, si se sobrecalienta mucho el ordenador poner 2 o 0


test:
    test_dir: './imagenes_todoeldia/imagenes_test'
    batch_size: 8
    num_workers: 0
    save_errors: False
    save_predictions: False
    save_confusion_matrix: False
    test_set: True

    
model:
    pick : 8
    models:
        -   model: "vgg" # `"Very Deep Convolutional Networks For Large-Scale Image Recognition" <https://arxiv.org/pdf/1409.1556.pdf>`
            type: 11 # 11 | 13 | 16 | 19
            bn: True
            num_classes: 3
            in_chans: 3 
            output_stride: 32 
            global_pool: 'avg' 
            drop_rate: 0.4
            #ckpt: "./model_zoo/vgg_stg2_110854.pt"
        -   model: "resnet"  # `Deep Residual Learning for Image Recognition" <https://arxiv.org/abs/1511.03385>`
            type: 50 # 18 | 26 | 34 | 50 | 101 | 152 | 200
            num_classes: 3
            in_chans: 3 
            output_stride: 32 
            global_pool: 'avg' 
            drop_rate: 0.2
            drop_path_rate: 0.
            #ckpt: "./model_zoo/resnet_stg2_110952.pt"
        -   model: "inception_v3" # `Going Deeper with Convolutions" <https://arxiv.org/abs/1409.4842>`
            num_classes: 3
            in_chans: 3 
            global_pool: 'avg' 
            drop_rate: 0.5
            #ckpt: "./model_zoo/inception_stg2_111019.pt"
        -   model: "densenet" # `"Densely Connected Convolutional Networks" <https://arxiv.org/pdf/1608.06993.pdf>`
            type: 121 # 121 | 161 | 169 | 201 
            num_classes: 3
            in_chans: 3 
            global_pool: 'avg' 
            drop_rate: 0.5
            #ckpt: "./model_zoo/densenet_stg2_111108.pt"
        -   model: "efficientnet" # `"EfficientNet: Rethinking Model Scaling for Convolutional Neural Networks" <https://arxiv.org/abs/1905.11946>`
            num_classes: 3
            in_chans: 3 
            global_pool: 'avg' 
            drop_rate: 0.2
            drop_path_rate: 0.2
            #ckpt: "./model_zoo/efficientnet_stg2_111138.pt"
        -   model: "regnet" # `"Designing Network Design Spaces" <https://arxiv.org/abs/2003.1367>`
            num_classes: 3
            in_chans: 3 
            output_stride: 32 
            global_pool: 'avg' 
            drop_rate: 0.2
            drop_path_rate: 0.1
            #ckpt: "./model_zoo/regnet_stg2_111213.pt"
        -   model: "vision_transformer" # `"An Image Is Worth 16 x 16 Words: Transformers for Image Recognition at Scale" <https://arxiv.org/abs/2010.11929>`
            type: base # base | large | huge
            num_classes: 3
            in_chans: 3 
            img_size: 512 
            global_pool: 'token' 
            drop_rate: 0.4
            drop_path_rate: 0.2
            #ckpt_transformers: "./model_zoo/vit_stg2_121344.pt"
        -   model: "swin_transformer" # `"Swin Transformer: Hierarchical Vision Transformer using Shifted Windows" <https://arxiv.org/pdf/2103.14030>`
            type: tiny # tiny | small | base | large
            num_classes: 3
            in_chans: 3 
            img_size: 512 
            global_pool: 'avg' 
            drop_rate: 0.4
            drop_path_rate: 0.2
            #ckpt_transformers: "./model_zoo/swin_stg2_151418.pt"
        -   model: "convnext_v2" # `"ConvNeXt-V2 - Co-designing and Scaling ConvNets with Masked Autoencode" <https://arxiv.org/abs/2301.00808>`
            type: tiny # tiny | small | base | large | huge
            num_classes: 3
            in_chans: 3 
            output_stride: 32 
            global_pool: 'avg' 
            drop_rate: 0.4
            drop_path_rate: 0.2
            #ckpt: "./model_zoo/convnext_stg2_bilinear_refined_181011.pt"
